name: Deploy to Hetzner VPS

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Deployment Script via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ github.sha }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          COOKIE_DOMAIN: ${{ secrets.COOKIE_DOMAIN }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          BCRYPT_SALT_ROUNDS: ${{ secrets.BCRYPT_SALT_ROUNDS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: ${{ secrets.HETZNER_USERNAME }}
          password: ${{ secrets.HETZNER_PASSWORD }}
          envs: IMAGE_TAG,DATABASE_URL,JWT_SECRET,JWT_REFRESH_SECRET,CORS_ORIGINS,COOKIE_DOMAIN,NEXT_PUBLIC_API_URL,BCRYPT_SALT_ROUNDS,GITHUB_TOKEN
          script: |
            set -Eeuo pipefail

            ############################################
            # Install Docker if missing
            ############################################

            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com -o get-docker.sh
              sudo sh get-docker.sh
              sudo systemctl enable docker
              sudo systemctl start docker
            fi

            if ! docker compose version >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y docker-compose-plugin
            fi

            ############################################
            # Firewall setup
            ############################################

            if command -v ufw >/dev/null 2>&1; then
              sudo ufw allow OpenSSH || true
              sudo ufw allow 80/tcp  || true
              sudo ufw allow 443/tcp || true
              sudo ufw delete allow 3000/tcp || true
              sudo ufw delete allow 5000/tcp || true
              sudo ufw --force enable || true
            fi

            ############################################
            # Disable Apache if installed
            ############################################

            if systemctl list-unit-files | grep -q '^apache2\.service'; then
              sudo systemctl stop apache2    || true
              sudo systemctl disable apache2 || true
            fi

            ############################################
            # Ensure PostgreSQL accepts Docker connections
            ############################################

            if command -v psql >/dev/null 2>&1 || dpkg -l postgresql* 2>/dev/null | grep -q '^ii'; then

              # Allow password auth from Docker bridge network (172.17.0.0/16)
              PG_HBA=$(sudo -u postgres psql -tAc "SHOW hba_file")
              DOCKER_RULE="host    birga_app    birga_admin    172.17.0.0/16    scram-sha-256"
              if ! sudo grep -qF "172.17.0.0/16" "$PG_HBA"; then
                echo "$DOCKER_RULE" | sudo tee -a "$PG_HBA" > /dev/null
                echo "Added Docker subnet rule to pg_hba.conf"
              fi

              # Allow PostgreSQL to listen on all interfaces (needed for host.docker.internal routing)
              PG_CONF=$(sudo -u postgres psql -tAc "SHOW config_file")
              sudo sed -i "s/^#*\s*listen_addresses\s*=.*/listen_addresses = '*'/" "$PG_CONF"

              # Reload PostgreSQL config (no restart needed)
              sudo systemctl reload postgresql || sudo -u postgres pg_ctlcluster "$(pg_lsclusters -h | awk '{print $1}' | head -1)" main reload || true
              echo "PostgreSQL config reloaded."

            else
              echo "PostgreSQL not installed locally — assuming external DB, skipping pg config."
            fi

            ############################################
            # Prepare project directory
            ############################################

            mkdir -p ~/birgaquramiz
            cd ~/birgaquramiz

            REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/Khondamir26/birgaquramiz.git"

            if [ ! -d ".git" ]; then
              git clone --depth 1 --branch main "$REPO_URL" .
            else
              git remote set-url origin "$REPO_URL"
              git fetch --depth 1 origin main
              git reset --hard origin/main
            fi

            ############################################
            # Fix DB connection URL for Docker containers
            # (replace localhost/127.0.0.1 → host.docker.internal)
            ############################################

            DATABASE_URL_DOCKER="$(printf '%s' "$DATABASE_URL" | sed -E 's/(127\.0\.0\.1|localhost)/host.docker.internal/g')"

            EFFECTIVE_CORS_ORIGINS="${CORS_ORIGINS:-https://birga-quramiz.uz}"
            EFFECTIVE_COOKIE_DOMAIN="${COOKIE_DOMAIN:-.birga-quramiz.uz}"
            EFFECTIVE_API_URL="${NEXT_PUBLIC_API_URL:-https://api.birga-quramiz.uz}"
            EFFECTIVE_BCRYPT_ROUNDS="${BCRYPT_SALT_ROUNDS:-12}"

            ############################################
            # Create .env file for Docker Compose
            ############################################

            umask 077
            cat > .env <<EOF
            APP_IMAGE_TAG=${IMAGE_TAG}
            DATABASE_URL=${DATABASE_URL_DOCKER}
            JWT_SECRET=${JWT_SECRET}
            JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
            CORS_ORIGINS=${EFFECTIVE_CORS_ORIGINS}
            COOKIE_DOMAIN=${EFFECTIVE_COOKIE_DOMAIN}
            NEXT_PUBLIC_API_URL=${EFFECTIVE_API_URL}
            BCRYPT_SALT_ROUNDS=${EFFECTIVE_BCRYPT_ROUNDS}
            EOF

            ############################################
            # Save tag & unset shell env vars
            # (prevents docker compose from preferring
            #  raw shell values over the .env file)
            ############################################

            DEPLOY_IMAGE_TAG="$IMAGE_TAG"
            PREVIOUS_TAG=""
            if [ -f ".last_successful_tag" ]; then
              PREVIOUS_TAG="$(cat .last_successful_tag)"
            fi

            unset IMAGE_TAG DATABASE_URL JWT_SECRET JWT_REFRESH_SECRET \
                  CORS_ORIGINS COOKIE_DOMAIN NEXT_PUBLIC_API_URL \
                  BCRYPT_SALT_ROUNDS GITHUB_TOKEN || true

            ############################################
            # Build containers
            ############################################

            docker compose build --pull backend frontend

            ############################################
            # Run database migrations
            ############################################

            docker compose run --rm backend pnpm prisma migrate deploy

            ############################################
            # Start services
            ############################################

            docker compose up -d --remove-orphans

            ############################################
            # Health check (2 minutes, every 5s)
            # Uses --resolve so health check works even
            # before DNS propagation on first deploy
            ############################################

            HEALTH_OK=0
            for _ in $(seq 1 24); do
              STATUS=$(curl -ksS -o /dev/null -w "%{http_code}" \
                --resolve "api.birga-quramiz.uz:443:127.0.0.1" \
                https://api.birga-quramiz.uz/health || true)
              if [ "$STATUS" = "200" ]; then
                HEALTH_OK=1
                break
              fi
              sleep 5
            done

            ############################################
            # Rollback if health check failed
            ############################################

            if [ "$HEALTH_OK" -ne 1 ]; then
              echo "::error::Deployment health check failed!"
              docker compose logs --tail=150 backend frontend caddy || true

              if [ -n "$PREVIOUS_TAG" ] && [ "$PREVIOUS_TAG" != "$DEPLOY_IMAGE_TAG" ]; then
                echo "Rolling back to tag: $PREVIOUS_TAG"
                sed -i "s/^APP_IMAGE_TAG=.*/APP_IMAGE_TAG=${PREVIOUS_TAG}/" .env
                docker compose up -d --remove-orphans

                ROLLBACK_OK=0
                for _ in $(seq 1 12); do
                  STATUS=$(curl -ksS -o /dev/null -w "%{http_code}" \
                    --resolve "api.birga-quramiz.uz:443:127.0.0.1" \
                    https://api.birga-quramiz.uz/health || true)
                  if [ "$STATUS" = "200" ]; then
                    ROLLBACK_OK=1
                    break
                  fi
                  sleep 5
                done

                if [ "$ROLLBACK_OK" -eq 1 ]; then
                  echo "::warning::Rolled back to $PREVIOUS_TAG successfully."
                else
                  echo "::error::Rollback also failed. Manual intervention required."
                fi
              else
                echo "No previous tag available for rollback."
              fi

              exit 1
            fi

            ############################################
            # Success: save tag & clean up old images
            ############################################

            echo "$DEPLOY_IMAGE_TAG" > .last_successful_tag
            docker image prune -f
            docker compose ps
name: Deploy to Hetzner VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Deployment Script via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          NEXT_PUBLIC_API_URL: https://api.birga-quramiz.uz
          CORS_ORIGINS: https://birga-quramiz.uz,https://www.birga-quramiz.uz,https://birgaquramiz.uz,https://www.birgaquramiz.uz
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: ${{ secrets.HETZNER_USERNAME }}
          password: ${{ secrets.HETZNER_PASSWORD }}
          envs: DATABASE_URL,DIRECT_URL,JWT_SECRET,SUPABASE_URL,SUPABASE_KEY,NEXT_PUBLIC_API_URL,CORS_ORIGINS
          script: |
            # Install Docker if it is not installed
            if ! command -v docker &> /dev/null; then
              echo "Docker not found. Installing Docker..."
              curl -fsSL https://get.docker.com -o get-docker.sh
              sudo sh get-docker.sh
              sudo systemctl enable docker
              sudo systemctl start docker
            fi
            
            # Ensure firewall ports are open
            if command -v ufw &> /dev/null; then
              sudo ufw allow 80/tcp
              sudo ufw allow 443/tcp
              sudo ufw allow 3000/tcp
              sudo ufw allow 10000/tcp
            fi
            
            # Kill apache2 if it was pre-installed on Ubuntu and is blocking port 80
            if command -v apache2 &> /dev/null; then
              sudo systemctl stop apache2 || true
              sudo systemctl disable apache2 || true
            fi
            
            # Create project directory
            mkdir -p ~/birgaquramiz
            cd ~/birgaquramiz
            
            # Clone or pull latest code
            if [ ! -d ".git" ]; then
              echo "Cleaning directory before cloning..."
              rm -rf ./*
              rm -rf .env
              git clone https://github.com/Khondamir26/birgaquramiz.git .
            else
              git rebase --abort || true
              git fetch origin main
              git reset --hard origin/main
              git clean -fd
            fi

            # Create the .env file with secrets dynamically generated by GitHub Actions
            echo "DATABASE_URL=$DATABASE_URL" > .env
            echo "DIRECT_URL=$DIRECT_URL" >> .env
            echo "JWT_SECRET=$JWT_SECRET" >> .env
            echo "SUPABASE_URL=$SUPABASE_URL" >> .env
            echo "SUPABASE_KEY=$SUPABASE_KEY" >> .env
            echo "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL" >> .env
            echo "CORS_ORIGINS=$CORS_ORIGINS" >> .env
            
            # Restart containers, rebuilding any updated images in detached mode
            docker compose down
            docker compose up -d --build
            
            # Prune dangling unused images to save disk space
            docker image prune -af
            
            # Print logs for debugging (sleep for 10s to let NestJS finish booting or crash)
            sleep 10
            echo "======================================"
            echo "           CONTAINER STATUS           "
            echo "======================================"
            docker compose ps
            echo "================ CADDY LOGS ================"
            docker compose logs --tail=50 caddy
            echo "=============== BACKEND LOGS ==============="
            docker compose logs --tail=50 backend
            echo "=============== FRONTEND LOGS =============="
            docker compose logs --tail=50 frontend

name: Deploy to Hetzner VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: ${{ secrets.HETZNER_USERNAME }}
          password: ${{ secrets.HETZNER_PASSWORD }}
          envs: DATABASE_URL,JWT_SECRET,CORS_ORIGINS,NEXT_PUBLIC_API_URL
          script: |
            set -e  # Stop immediately on any error

            # ── Docker ─────────────────────────────────────────────
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              curl -fsSL https://get.docker.com -o get-docker.sh
              sudo sh get-docker.sh
              sudo systemctl enable docker
              sudo systemctl start docker
            fi

            # ── Firewall ────────────────────────────────────────────
            if command -v ufw &> /dev/null; then
              sudo ufw allow OpenSSH
              sudo ufw allow 80/tcp
              sudo ufw allow 443/tcp
              sudo ufw deny 5432        # PostgreSQL must never be public
              sudo ufw --force enable
            fi

            # ── Kill apache2 if blocking port 80 ────────────────────
            if systemctl is-active --quiet apache2; then
              sudo systemctl stop apache2
              sudo systemctl disable apache2
            fi

            # ── Pull latest code ────────────────────────────────────
            mkdir -p ~/birgaquramiz
            cd ~/birgaquramiz

            if [ ! -d ".git" ]; then
              git clone https://github.com/Khondamir26/birgaquramiz.git .
            else
              git fetch origin main
              git reset --hard origin/main
              git clean -fd
            fi

            # ── Write production .env for the backend ───────────────
            # This file is gitignored — CI/CD is the only way it gets written
            cat > Birga_Quramiz_Backend/.env << EOF
            DATABASE_URL=${DATABASE_URL}
            JWT_SECRET=${JWT_SECRET}
            CORS_ORIGINS=${CORS_ORIGINS}
            EOF

            # ── Write .env for the frontend ─────────────────────────
            cat > Birga_Quramiz_Frontend/.env.local << EOF
            NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
            EOF

            # ── Build & restart containers ──────────────────────────
            docker compose down
            docker compose up -d --build

            # ── Prune old images to save disk space ─────────────────
            docker image prune -af

            # ── Wait for containers to settle ───────────────────────
            sleep 15

            # ── Status & logs ───────────────────────────────────────
            echo "========== CONTAINER STATUS =========="
            docker compose ps

            echo "========== BACKEND LOGS =========="
            docker compose logs --tail=60 backend

            echo "========== FRONTEND LOGS =========="
            docker compose logs --tail=30 frontend

            echo "========== CADDY LOGS =========="
            docker compose logs --tail=30 caddy

            # ── Health check — fail the CI run if backend is down ───
            echo "Running health check..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/health || echo "000")
            if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "404" ]; then
              echo "✅ Backend is responding (HTTP $HTTP_STATUS)"
            else
              echo "❌ Backend health check failed (HTTP $HTTP_STATUS)"
              exit 1
            fi

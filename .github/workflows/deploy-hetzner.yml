name: Deploy to Hetzner VPS

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: "Backend: Lint & Build"
        run: |
          cd Birga_Quramiz_Backend
          pnpm install --frozen-lockfile
          pnpm prisma generate
          pnpm run lint
          pnpm run build

      - name: "Frontend: Lint & Build"
        run: |
          cd Birga_Quramiz_Frontend
          pnpm install --frozen-lockfile
          pnpm run lint
          # Build check (mocking env to satisfy Next.js build)
          NEXT_PUBLIC_API_URL=https://api.birga-quramiz.uz pnpm run build

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Deployment Script via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ github.sha }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          COOKIE_DOMAIN: ${{ secrets.COOKIE_DOMAIN }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          BCRYPT_SALT_ROUNDS: ${{ secrets.BCRYPT_SALT_ROUNDS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PAYME_MERCHANT_KEY: ${{ secrets.PAYME_MERCHANT_KEY }}
          CLICK_SECRET_KEY: ${{ secrets.CLICK_SECRET_KEY }}
          CLICK_SERVICE_ID: ${{ secrets.CLICK_SERVICE_ID }}
          REMOVE_BG_API_KEY: ${{ secrets.REMOVE_BG_API_KEY }}
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: ${{ secrets.HETZNER_USERNAME }}
          password: ${{ secrets.HETZNER_PASSWORD }}
          envs: IMAGE_TAG,DATABASE_URL,POSTGRES_PASSWORD,JWT_SECRET,JWT_REFRESH_SECRET,CORS_ORIGINS,COOKIE_DOMAIN,NEXT_PUBLIC_API_URL,BCRYPT_SALT_ROUNDS,GITHUB_TOKEN,TELEGRAM_BOT_TOKEN,PAYME_MERCHANT_KEY,CLICK_SECRET_KEY,CLICK_SERVICE_ID,REMOVE_BG_API_KEY
          script: |
            set -Eeuo pipefail

            ############################################
            # Install Docker if missing
            ############################################

            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com -o get-docker.sh
              sudo sh get-docker.sh
              sudo systemctl enable docker
              sudo systemctl start docker
            fi

            if ! docker compose version >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y docker-compose-plugin
            fi

            ############################################
            # Firewall setup
            ############################################

            if command -v ufw >/dev/null 2>&1; then
              sudo ufw allow OpenSSH || true
              sudo ufw allow 80/tcp  || true
              sudo ufw allow 443/tcp || true
              sudo ufw delete allow 3000/tcp || true
              sudo ufw delete allow 5000/tcp || true
              sudo ufw --force enable || true
            fi

            ############################################
            # Disable Apache if installed
            ############################################

            if systemctl list-unit-files | grep -q '^apache2\.service'; then
              sudo systemctl stop apache2    || true
              sudo systemctl disable apache2 || true
            fi

            ############################################
            # Ensure PostgreSQL accepts Docker connections
            ############################################

            if command -v psql >/dev/null 2>&1 || dpkg -l postgresql* 2>/dev/null | grep -q '^ii'; then

              # Allow password auth from Docker bridge network (172.17.0.0/16)
              PG_HBA=$(sudo -u postgres psql -tAc "SHOW hba_file")
              DOCKER_RULE="host    birga_app    birga_admin    172.17.0.0/16    scram-sha-256"
              if ! sudo grep -qF "172.17.0.0/16" "$PG_HBA"; then
                echo "$DOCKER_RULE" | sudo tee -a "$PG_HBA" > /dev/null
                echo "Added Docker subnet rule to pg_hba.conf"
              fi

              # Allow PostgreSQL to listen on all interfaces (needed for host.docker.internal routing)
              PG_CONF=$(sudo -u postgres psql -tAc "SHOW config_file")
              sudo sed -i "s/^#*\s*listen_addresses\s*=.*/listen_addresses = '*'/" "$PG_CONF"

              # Reload PostgreSQL config (no restart needed)
              sudo systemctl reload postgresql || sudo -u postgres pg_ctlcluster "$(pg_lsclusters -h | awk '{print $1}' | head -1)" main reload || true
              echo "PostgreSQL config reloaded."

            else
              echo "PostgreSQL not installed locally — assuming external DB, skipping pg config."
            fi

            ############################################
            # Prepare project directory
            ############################################

            mkdir -p ~/birgaquramiz
            cd ~/birgaquramiz

            REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/Khondamir26/birgaquramiz.git"

            if [ ! -d ".git" ]; then
              git clone --depth 1 --branch main "$REPO_URL" .
            else
              git remote set-url origin "$REPO_URL"
              git fetch --depth 1 origin main
              git reset --hard origin/main
            fi

            ############################################
            # Fix DB connection URL for Docker containers
            # (replace localhost/127.0.0.1 → host.docker.internal)
            ############################################

            DATABASE_URL_DOCKER="$(printf '%s' "$DATABASE_URL" | sed -E 's/(127\.0\.0\.1|localhost)/172.17.0.1/g')"

            EFFECTIVE_CORS_ORIGINS="${CORS_ORIGINS:-https://birga-quramiz.uz}"
            EFFECTIVE_COOKIE_DOMAIN="${COOKIE_DOMAIN:-.birga-quramiz.uz}"
            EFFECTIVE_API_URL="${NEXT_PUBLIC_API_URL:-https://api.birga-quramiz.uz}"
            EFFECTIVE_BCRYPT_ROUNDS="${BCRYPT_SALT_ROUNDS:-12}"

            ############################################
            # Save tag & write .env for Docker Compose
            # (prevents docker compose from preferring
            #  raw shell values over the .env file)
            ############################################

            DEPLOY_IMAGE_TAG="$IMAGE_TAG"
            PREVIOUS_TAG=""
            if [ -f ".last_successful_tag" ]; then
              PREVIOUS_TAG="$(cat .last_successful_tag)"
            fi

            umask 077
            {
              printf 'APP_IMAGE_TAG=%s\n'        "${DEPLOY_IMAGE_TAG}"
              printf 'DATABASE_URL=%s\n'         "${DATABASE_URL_DOCKER}"
              printf 'POSTGRES_PASSWORD=%s\n'    "${POSTGRES_PASSWORD}"
              printf 'JWT_SECRET=%s\n'           "${JWT_SECRET}"
              printf 'JWT_REFRESH_SECRET=%s\n'   "${JWT_REFRESH_SECRET}"
              printf 'CORS_ORIGINS=%s\n'         "${EFFECTIVE_CORS_ORIGINS}"
              printf 'COOKIE_DOMAIN=%s\n'        "${EFFECTIVE_COOKIE_DOMAIN}"
              printf 'NEXT_PUBLIC_API_URL=%s\n'  "${EFFECTIVE_API_URL}"
              printf 'BCRYPT_SALT_ROUNDS=%s\n'   "${EFFECTIVE_BCRYPT_ROUNDS}"
              printf 'TELEGRAM_BOT_TOKEN=%s\n'   "${TELEGRAM_BOT_TOKEN}"
              printf 'PAYME_MERCHANT_KEY=%s\n'   "${PAYME_MERCHANT_KEY:-test-payme-secret-key}"
              printf 'CLICK_SECRET_KEY=%s\n'     "${CLICK_SECRET_KEY:-test-click-secret-key}"
              printf 'CLICK_SERVICE_ID=%s\n'     "${CLICK_SERVICE_ID:-test-click-service-id}"
              printf 'REMOVE_BG_API_KEY=%s\n'   "${REMOVE_BG_API_KEY}"
            } > .env

            unset IMAGE_TAG DATABASE_URL POSTGRES_PASSWORD JWT_SECRET JWT_REFRESH_SECRET \
                  CORS_ORIGINS COOKIE_DOMAIN NEXT_PUBLIC_API_URL \
                  BCRYPT_SALT_ROUNDS GITHUB_TOKEN TELEGRAM_BOT_TOKEN \
                  PAYME_MERCHANT_KEY CLICK_SECRET_KEY CLICK_SERVICE_ID \
                  REMOVE_BG_API_KEY || true

            ############################################
            # Build containers
            ############################################

            docker compose build --pull backend frontend

            ############################################
            # Run database migrations
            ############################################

            docker compose run --rm backend pnpm prisma migrate deploy

            ############################################
            # Start services
            ############################################

            docker compose up -d --remove-orphans

            # Restart Caddy so it reconnects to updated backend/frontend containers
            docker restart caddy-proxy || true
            sleep 3

            ############################################
            # Health check (2 minutes, every 5s)
            # Uses --resolve so health check works even
            # before DNS propagation on first deploy
            ############################################

            HEALTH_OK=0
            for _ in $(seq 1 24); do
              STATUS=$(curl -ksS -o /dev/null -w "%{http_code}" \
                --resolve "api.birga-quramiz.uz:443:127.0.0.1" \
                https://api.birga-quramiz.uz/health || true)
              if [ "$STATUS" = "200" ]; then
                HEALTH_OK=1
                break
              fi
              sleep 5
            done

            ############################################
            # Rollback if health check failed
            ############################################

            if [ "$HEALTH_OK" -ne 1 ]; then
              echo "::error::Deployment health check failed!"
              docker compose logs --tail=150 backend frontend caddy || true

              if [ -n "$PREVIOUS_TAG" ] && [ "$PREVIOUS_TAG" != "$DEPLOY_IMAGE_TAG" ]; then
                echo "Rolling back to tag: $PREVIOUS_TAG"
                sed -i "s/^APP_IMAGE_TAG=.*/APP_IMAGE_TAG=${PREVIOUS_TAG}/" .env
                docker compose up -d --remove-orphans

                ROLLBACK_OK=0
                for _ in $(seq 1 12); do
                  STATUS=$(curl -ksS -o /dev/null -w "%{http_code}" \
                    --resolve "api.birga-quramiz.uz:443:127.0.0.1" \
                    https://api.birga-quramiz.uz/health || true)
                  if [ "$STATUS" = "200" ]; then
                    ROLLBACK_OK=1
                    break
                  fi
                  sleep 5
                done

                if [ "$ROLLBACK_OK" -eq 1 ]; then
                  echo "::warning::Rolled back to $PREVIOUS_TAG successfully."
                else
                  echo "::error::Rollback also failed. Manual intervention required."
                fi
              else
                echo "No previous tag available for rollback."
              fi

              exit 1
            fi

            ############################################
            # Success: save tag & clean up old images
            ############################################

            echo "$DEPLOY_IMAGE_TAG" > .last_successful_tag
            docker image prune -f
            docker compose ps

name: Deploy to Hetzner VPS

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Deployment Script via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ github.sha }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          COOKIE_DOMAIN: ${{ secrets.COOKIE_DOMAIN }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          BCRYPT_SALT_ROUNDS: ${{ secrets.BCRYPT_SALT_ROUNDS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: ${{ secrets.HETZNER_USERNAME }}
          password: ${{ secrets.HETZNER_PASSWORD }}
          envs: IMAGE_TAG,DATABASE_URL,JWT_SECRET,JWT_REFRESH_SECRET,CORS_ORIGINS,COOKIE_DOMAIN,NEXT_PUBLIC_API_URL,BCRYPT_SALT_ROUNDS,GITHUB_TOKEN
          script: |
            set -Eeuo pipefail

            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com -o get-docker.sh
              sudo sh get-docker.sh
              sudo systemctl enable docker
              sudo systemctl start docker
            fi

            if ! docker compose version >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y docker-compose-plugin
            fi

            if command -v ufw >/dev/null 2>&1; then
              sudo ufw allow OpenSSH || true
              sudo ufw allow 80/tcp || true
              sudo ufw allow 443/tcp || true
              sudo ufw delete allow 3000/tcp || true
              sudo ufw delete allow 5000/tcp || true
              sudo ufw --force enable || true
            fi

            if systemctl list-unit-files | grep -q '^apache2\.service'; then
              sudo systemctl stop apache2 || true
              sudo systemctl disable apache2 || true
            fi

            mkdir -p ~/birgaquramiz
            cd ~/birgaquramiz

            REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/Khondamir26/birgaquramiz.git"
            if [ ! -d ".git" ]; then
              git clone --depth 1 --branch main "$REPO_URL" .
            else
              git remote set-url origin "$REPO_URL"
              git fetch --depth 1 origin main
              git checkout -B main origin/main
            fi

            # Replace localhost or 127.0.0.1 with host.docker.internal
            DATABASE_URL_DOCKER="$(printf '%s' "$DATABASE_URL" | sed -E 's/(127\.0\.0\.1|localhost)/<VPS_INTERNAL_IP>/g')"
            EFFECTIVE_CORS_ORIGINS="${CORS_ORIGINS:-https://birga-quramiz.uz}"
            EFFECTIVE_COOKIE_DOMAIN="${COOKIE_DOMAIN:-.birga-quramiz.uz}"
            EFFECTIVE_API_URL="${NEXT_PUBLIC_API_URL:-https://api.birga-quramiz.uz}"
            EFFECTIVE_BCRYPT_ROUNDS="${BCRYPT_SALT_ROUNDS:-12}"

            umask 077
            cat > .env <<-EOF
            APP_IMAGE_TAG=${IMAGE_TAG}
            DATABASE_URL=${DATABASE_URL_DOCKER}
            JWT_SECRET=${JWT_SECRET}
            JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
            CORS_ORIGINS=${EFFECTIVE_CORS_ORIGINS}
            COOKIE_DOMAIN=${EFFECTIVE_COOKIE_DOMAIN}
            NEXT_PUBLIC_API_URL=${EFFECTIVE_API_URL}
            BCRYPT_SALT_ROUNDS=${EFFECTIVE_BCRYPT_ROUNDS}
            EOF
            sed -i 's/^[[:space:]]*//' .env

            # Unset variables exported by appleboy/ssh-action so docker compose strictly uses the .env file values
            unset IMAGE_TAG DATABASE_URL JWT_SECRET JWT_REFRESH_SECRET CORS_ORIGINS COOKIE_DOMAIN NEXT_PUBLIC_API_URL BCRYPT_SALT_ROUNDS GITHUB_TOKEN || true

            PREVIOUS_TAG=""
            if [ -f ".last_successful_tag" ]; then
              PREVIOUS_TAG="$(cat .last_successful_tag)"
            fi

            docker compose build --pull backend frontend
            docker compose run --rm backend npx prisma migrate deploy
            docker compose up -d --remove-orphans

            HEALTH_OK=0
            for _ in $(seq 1 24); do
              STATUS="$(curl -ksS -o /dev/null -w '%{http_code}' --resolve api.birga-quramiz.uz:443:127.0.0.1 https://api.birga-quramiz.uz/health || true)"
              if [ "$STATUS" = "200" ]; then
                HEALTH_OK=1
                break
              fi
              sleep 5
            done

            if [ "$HEALTH_OK" -ne 1 ]; then
              echo "Deployment health check failed, attempting rollback..."
              if [ -n "$PREVIOUS_TAG" ] && [ "$PREVIOUS_TAG" != "$IMAGE_TAG" ]; then
                sed -i "s/^APP_IMAGE_TAG=.*/APP_IMAGE_TAG=${PREVIOUS_TAG}/" .env
                docker compose up -d --remove-orphans

                ROLLBACK_OK=0
                for _ in $(seq 1 24); do
                  STATUS="$(curl -ksS -o /dev/null -w '%{http_code}' --resolve api.birga-quramiz.uz:443:127.0.0.1 https://api.birga-quramiz.uz/health || true)"
                  if [ "$STATUS" = "200" ]; then
                    ROLLBACK_OK=1
                    break
                  fi
                  sleep 5
                done

                if [ "$ROLLBACK_OK" -ne 1 ]; then
                  docker compose logs --tail=120 backend frontend caddy || true
                  echo "Rollback failed."
                  exit 1
                fi

                echo "Rollback completed successfully."
                exit 1
              fi

              docker compose logs --tail=120 backend frontend caddy || true
              echo "No rollback tag available."
              exit 1
            fi

            echo "$IMAGE_TAG" > .last_successful_tag
            docker image prune -f
            docker compose ps
